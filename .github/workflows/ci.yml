name: ci

# O CI roda a suite de propriedades e o teste de fumaca do ambiente. A rampa de
# capacidade NAO entra: ela mede a maquina, e runner compartilhado nao serve de
# linha de base -- licao que o P01 aprendeu medindo binarios identicos em dois
# runners e obtendo 54% de diferenca.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  elixir:
    runs-on: ubuntu-latest
    name: nucleo OTP
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          elixir-version: '1.18'
      - name: compilar com avisos como erro
        working-directory: elixir/mesh
        run: mix compile --warnings-as-errors
      - name: formatacao
        working-directory: elixir/mesh
        run: mix format --check-formatted
      - name: testes de propriedade (caos e contrapressao)
        working-directory: elixir/mesh
        run: mix test
      # Uma rampa curta, so para provar que o benchmark executa. O numero dele
      # nao e comparavel entre execucoes do CI.
      - name: benchmark executa (rampa curta)
        working-directory: elixir/mesh
        run: |
          sed 's/^degraus = .*/degraus = [1_000, 10_000]/' bench/capacity.exs > /tmp/short.exs
          mix run /tmp/short.exs

  go:
    runs-on: ubuntu-latest
    name: gateway em Go
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          # Sem cache de modulos: o projeto nao tem dependencia nenhuma.
          cache: false
      - name: formatacao
        working-directory: go
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        working-directory: go
        run: go vet ./...
      - name: testes do WebSocket
        working-directory: go
        run: go test -race ./...
      - name: compila os dois binarios
        working-directory: go
        run: |
          go build ./cmd/gateway
          go build ./cmd/loadgen
      # O benchmark de conexoes NAO entra: ele mexe em sysctl e depende de
      # limites de kernel do runner. Em vez disso, uma rampa minima que prova
      # que gateway e loadgen conversam de verdade.
      - name: gateway e loadgen conversam
        working-directory: go
        run: |
          go run ./cmd/gateway -addr 127.0.0.1:8099 -quiet &
          sleep 2
          go run ./cmd/loadgen -addr 127.0.0.1:8099 -n 200 -hold 2s
          curl -fsS http://127.0.0.1:8099/stats

  # O NIF em Rust e opcional no projeto, mas o CI o compila: e a unica forma de
  # verificar que o codec em Rust segue conforme aos vetores compartilhados.
  nif:
    runs-on: ubuntu-latest
    name: NIF em Rust
    # A variavel vale para o job inteiro, e tem de valer: `deps/0` em mix.exs so
    # declara o rustler quando ela esta definida. Com ela apenas nos passos de
    # compilar e testar, o `mix deps.get` devolvia zero dependencias e a
    # compilacao seguinte falhava por rustler ausente -- o espelho exato do erro
    # anterior, em que o rustler era sempre declarado e os jobs do nucleo
    # quebravam por nao rodarem deps.get.
    env:
      MESH_BUILD_NIF: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          elixir-version: '1.18'
      - uses: dtolnay/rust-toolchain@stable
      - name: dependencias
        working-directory: elixir/mesh
        run: mix deps.get
      - name: compilar com o NIF
        working-directory: elixir/mesh
        run: mix compile --force --warnings-as-errors
      - name: testes, incluindo os 9 do NIF
        working-directory: elixir/mesh
        run: mix test --force
      # Rampa curta: o numero do benchmark depende da maquina, e runner
      # compartilhado nao serve de linha de base. Aqui o objetivo e so provar
      # que o benchmark executa.
      - name: benchmark da travessia executa
        working-directory: elixir/mesh
        run: mix run bench/nif.exs

  # O Scala mede concorrencia, e o numero depende da maquina -- runner
  # compartilhado nao serve de linha de base (o p01 descobriu que dois runners
  # identicos dao 631 e 411 Mops/s). Aqui o job prova que os dois programas
  # COMPILAM E EXECUTAM, com alvos pequenos. Os numeros publicados no README
  # vem da maquina local, e isso esta dito lá.
  scala:
    runs-on: ubuntu-latest
    name: concorrencia em Scala
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          # 21+ e obrigatorio: Thread.ofVirtual nao existe antes.
          java-version: '21'
      - uses: VirtusLab/scala-cli-setup@v1
        with:
          jvm: '21'
      - name: compila
        working-directory: scala/loadgen
        run: scala-cli compile . --jvm system
      # Alvo pequeno de proposito: o muro da thread de plataforma (30.568
      # nesta maquina) depende de memoria e de limites do sistema, e no runner
      # seria outro numero. O passo verifica que a rampa EXECUTA e reporta,
      # nao que o muro esta em algum lugar especifico.
      - name: rampa de thread de plataforma executa
        working-directory: scala/loadgen
        run: scala-cli run Concorrencia.scala --jvm system -- platform 4000
      - name: rampa de thread virtual executa
        working-directory: scala/loadgen
        run: scala-cli run Concorrencia.scala --jvm system -- virtual 50000
      - name: inanicao sob carga de CPU
        working-directory: scala/loadgen
        run: scala-cli run Preempcao.scala --jvm system -- 4 2

  # Carga pequena de proposito: os numeros de contencao dependem do numero de
  # nucleos (o runner tem 2, a maquina local 8) e runner compartilhado nao
  # serve de linha de base. O que o job verifica e o que NAO depende da
  # maquina: que todos os mecanismos coordenados contam certo, e que o sem
  # coordenacao perde atualizacoes. Isso vale em qualquer numero de nucleos.
  clojure:
    runs-on: ubuntu-latest
    name: contencao em Clojure
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: instalar clojure
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clojure
          clojure -e '(println "clojure" (clojure-version))'
      - name: contencao, e o sem-coordenacao perdendo atualizacoes
        working-directory: clojure/contencao
        run: |
          set -euo pipefail
          clojure contencao.clj 4 50000 | tee /tmp/saida.txt
          # Os quatro mecanismos coordenados tem de contar certo.
          corretos=$(grep -cE '^(AtomicLong|atom|ref|agent).*sim$' /tmp/saida.txt)
          test "$corretos" -eq 4 || { echo "esperava 4 corretos, achei $corretos"; exit 1; }
          # E o STM nao pode ter violacao de invariante entre dois refs.
          grep -qE '^dois refs \(STM\) +1000000 +0$' /tmp/saida.txt             || { echo "STM violou a invariante dos dois contadores"; exit 1; }

  gleam:
    runs-on: ubuntu-latest
    name: codec em Gleam
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          # O Gleam compila para Erlang e usa rebar3 para a stdlib.
          #
          # A versao tem de bater com a travada em manifest.toml: o
          # gleam_stdlib 1.0.5 declara `gleam >= 1.14`, e com 1.9 no runner o
          # `gleam test` falhava com "Incompatible Gleam version". Lockfile
          # commitado nao protege de toolchain velha -- protege do contrario.
          gleam-version: '1.19'
          rebar3-version: '3'
      - name: formatacao
        working-directory: gleam/mesh_codec
        run: gleam format --check src test
      - name: testes do codec, contra os vetores compartilhados
        working-directory: gleam/mesh_codec
        run: gleam test

  # O teste que atravessa as duas linguagens. Testes de unidade dos dois lados
  # passariam mesmo com o protocolo divergindo: o enquadramento so e exercitado
  # de verdade quando os bytes atravessam.
  integracao:
    runs-on: ubuntu-latest
    name: integracao Go <-> Elixir
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          elixir-version: '1.18'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: dependencias do Elixir
        working-directory: elixir/mesh
        run: mix compile
      - name: integracao de ponta a ponta
        run: N=300 bash tests/integracao.sh

  ambiente:
    runs-on: ubuntu-latest
    name: teste de fumaca do ambiente
    steps:
      - uses: actions/checkout@v5
      # O apt do runner traz um OTP mais antigo que o declarado pelo projeto, e
      # o Gleam falha ao compilar a propria stdlib nele. Instalar o OTP 27
      # primeiro faz o setup.sh pular erlang/elixir -- ele verifica a
      # ferramenta, nao o pacote -- e o ambiente passa a bater com o declarado
      # em docs/AMBIENTE.md.
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          elixir-version: '1.18'
      - name: provisionar
        run: sudo --preserve-env=PATH bash setup.sh
      # So o estagio das linguagens: 'infra' sobe um cluster kind, que no
      # runner duplicaria o que o job acima ja cobre a um custo bem maior.
      - name: smoke das linguagens
        run: bash tests/smoke.sh langs
