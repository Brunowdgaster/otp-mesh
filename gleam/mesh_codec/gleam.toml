name = "mesh_codec"
version = "1.0.0"
description = "Codec tipado do protocolo da ponte do otp-mesh, em Gleam"
licences = ["MIT"]
repository = { type = "github", user = "Brunowdgaster", repo = "otp-mesh" }

# Nenhuma dependencia alem da biblioteca padrao e do framework de teste. O I/O
# de arquivo, que a stdlib do Gleam nao tem, e feito com @external chamando
# `file:read_file/1` do OTP -- ver test/mesh_codec_test.gleam.

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
